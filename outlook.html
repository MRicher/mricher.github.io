<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>News list to Outlook</title>
<style>
  body { font-family: Calibri, Arial, sans-serif; margin: 2rem; max-width: 960px; }
  h2 { margin-top: 1.5rem; }
  table.editor { width: 100%; border-collapse: collapse; }
  .editor th, .editor td { padding: 4px; text-align: left; }
  .editor input { padding: .35rem; width: 100%; box-sizing: border-box; }
  .editor input.w { width: 70px; }
  button { padding: .4rem .8rem; cursor: pointer; }
  .bar { margin: .75rem 0; display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .bar input { padding: .4rem; }
  #content { border: 1px solid #ccc; padding: 1rem; border-radius: 6px; }
</style>
</head>
<body>

<h1>News list</h1>
<div class="bar">
  <label>Banner image: <input type="file" id="bannerFile" accept="image/png,image/jpeg,image/gif"></label>
  <label>Banner alt text: <input id="bannerAlt" size="40" placeholder="Describe the banner (leave empty if decorative)"></label>
  <button id="bannerRemove">Remove banner</button>
</div>
<p>Items are ordered by <b>weight</b> (higher = first), then by newest date.</p>

<table class="editor">
  <thead><tr><th>Headline</th><th>URL</th><th>Date</th><th>Weight</th><th></th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<div class="bar">
  <button id="addBtn">+ Add item</button>
  <input id="subject" aria-label="Subject" placeholder="Subject" value="News digest">
  <input id="lang" aria-label="Language code" size="5" value="en" title="Language code, e.g. en, fr">
  <button id="saveBtn">Save for Outlook (.eml → .oft)</button>
</div>

<h2>Preview</h2>
<div id="content"></div>

<script>
const KEY = "newsItems";
let items = [];
try { items = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) {}
if (!items.length) items = [
  { headline: "Example headline", url: "https://example.com", date: new Date().toISOString().slice(0,10), weight: 5 }
];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : "https://" + u;

function persist() { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} }

function sorted() {
  return [...items].sort((a, b) =>
    (b.weight - a.weight) || String(b.date).localeCompare(String(a.date)));
}

function renderEditor() {
  const tbody = $("rows");
  tbody.innerHTML = "";
  items.forEach((it, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td><input data-f="headline" value="${esc(it.headline)}"></td>
       <td><input data-f="url" value="${esc(it.url)}"></td>
       <td><input data-f="date" type="date" value="${esc(it.date)}"></td>
       <td><input data-f="weight" class="w" type="number" value="${esc(it.weight)}"></td>
       <td><button data-del>Delete</button></td>`;
    tr.querySelectorAll("input").forEach(inp =>
      inp.setAttribute("aria-label", `${inp.dataset.f} of item ${i + 1}`));
    tr.querySelector("[data-del]").setAttribute("aria-label", `Delete item ${i + 1}`);
    tr.querySelectorAll("input").forEach(inp => inp.addEventListener("input", () => {
      const f = inp.dataset.f;
      items[i][f] = f === "weight" ? Number(inp.value) || 0 : inp.value;
      persist(); renderPreview();
    }));
    // Re-order the editor rows once a weight/date edit is committed (on blur/Enter)
    tr.querySelectorAll('input[data-f="weight"], input[data-f="date"]').forEach(inp =>
      inp.addEventListener("change", () => {
        items = sorted(); persist(); renderEditor(); renderPreview();
      }));
    tr.querySelector("[data-del]").addEventListener("click", () => {
      items.splice(i, 1); persist(); renderEditor(); renderPreview();
    });
    tbody.appendChild(tr);
  });
}

let banner = null;
try { banner = JSON.parse(localStorage.getItem("newsBanner") || "null"); } catch (e) {}

// forExport=true swaps the embedded image for a cid: reference (works in Outlook)
// Markup targets WCAG 2.2 AA: language, title, headings, alt text, contrast >= 4.5:1,
// underlined links, readable sizes, and a layout table marked role="presentation".
function fmtDate(d) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || "");
  if (!m) return d || "";
  return new Date(+m[1], m[2] - 1, +m[3]).toLocaleDateString(
    $("lang").value.trim() || "en", { year: "numeric", month: "long", day: "numeric" });
}

function contentHtml(forExport) {
  const font = "font-family:Calibri,Arial,sans-serif;";
  const alt = $("bannerAlt").value.trim();
  const img = banner
    ? `<tr><td style="padding:0 0 16px 0;"><img src="${forExport ? "cid:banner" : banner.dataUrl}" alt="${esc(alt)}" width="600" style="display:block;width:100%;max-width:600px;height:auto;border:0;"></td></tr>`
    : "";
  const title = `<tr><td style="padding:0 0 16px 0;"><h1 style="margin:0;${font}font-size:24px;line-height:1.3;color:#1a1a1a;">${esc($("subject").value)}</h1></td></tr>`;
  const rows = sorted().filter(it => it.headline.trim()).map(it => {
    const url = it.url.trim();
    const h = url
      ? `<a href="${esc(safeUrl(url))}" style="color:#0b4fb3;text-decoration:underline;">${esc(it.headline)}</a>`
      : esc(it.headline);
    return `<tr><td style="padding:0 0 20px 0;">` +
      `<h2 style="margin:0 0 4px 0;${font}font-size:18px;line-height:1.4;color:#1a1a1a;">${h}</h2>` +
      `<p style="margin:0;${font}font-size:14px;line-height:1.5;color:#595959;">${esc(fmtDate(it.date))}</p>` +
      `</td></tr>`;
  }).join("") || `<tr><td style="${font}font-size:16px;color:#1a1a1a;">No items.</td></tr>`;
  return `<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;">${img}${title}${rows}</table>`;
}

function renderPreview() { $("content").innerHTML = contentHtml(false); }

$("addBtn").addEventListener("click", () => {
  items.push({ headline: "", url: "", date: new Date().toISOString().slice(0,10), weight: 1 });
  persist(); renderEditor(); renderPreview();
});

function toBase64Utf8(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/.{1,76}/g, "$&\r\n");
}

function buildEml(subject, html, img) {
  const encSubject = "=?UTF-8?B?" + btoa(
    String.fromCharCode(...new TextEncoder().encode(subject))) + "?=";
  const head = ["X-Unsent: 1", "Subject: " + encSubject, "MIME-Version: 1.0"];
  const m = img && /^data:([^;]+);base64,(.*)$/.exec(img.dataUrl);
  if (!m) return head.concat(["Content-Type: text/html; charset=utf-8",
    "Content-Transfer-Encoding: base64", "", toBase64Utf8(html)]).join("\r\n");
  const b = "----=_Part_" + Date.now();
  return head.concat([
    'Content-Type: multipart/related; boundary="' + b + '"; type="text/html"', "",
    "--" + b,
    "Content-Type: text/html; charset=utf-8",
    "Content-Transfer-Encoding: base64", "", toBase64Utf8(html),
    "--" + b,
    "Content-Type: " + m[1],
    "Content-Transfer-Encoding: base64",
    "Content-ID: <banner>",
    'Content-Disposition: inline; filename="banner"', "",
    m[2].replace(/.{1,76}/g, "$&\r\n"),
    "--" + b + "--", ""
  ]).join("\r\n");
}

$("saveBtn").addEventListener("click", () => {
  const subject = $("subject").value || "News digest";
  const lang = esc($("lang").value.trim() || "en");
  const html = `<!DOCTYPE html><html lang="${lang}" xml:lang="${lang}"><head><meta charset="utf-8"><title>${esc(subject)}</title></head><body>` +
               contentHtml(true) + "</body></html>";
  const blob = new Blob([buildEml(subject, html, banner)], { type: "message/rfc822" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = subject.replace(/[\\/:*?"<>|]+/g, "_") + ".eml";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
});

$("bannerFile").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    banner = { dataUrl: r.result };
    try { localStorage.setItem("newsBanner", JSON.stringify(banner)); } catch (err) {}
    renderPreview();
  };
  r.readAsDataURL(f);
});
$("bannerRemove").addEventListener("click", () => {
  banner = null;
  try { localStorage.removeItem("newsBanner"); } catch (err) {}
  $("bannerFile").value = "";
  renderPreview();
});

["subject", "bannerAlt", "lang"].forEach(id => $(id).addEventListener("input", renderPreview));

items = sorted();
renderEditor(); renderPreview();
</script>
</body>
</html>
