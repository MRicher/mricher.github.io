<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10-4 Studio</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: Calibri, Arial, sans-serif; }
  button { padding: .4rem .8rem; cursor: pointer; }
  .app { display: grid; grid-template-columns: minmax(520px, 1fr) 680px; height: 100vh; }
  .editor-pane { overflow: auto; padding: 1.5rem; }
  .preview-pane { overflow: auto; padding: 1.5rem; background: #f3f3f3; border-left: 1px solid #ccc; }
  .editor-pane h1, .preview-pane h2 { margin-top: 0; }
  .bar { margin: .75rem 0; display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .bar input, .bar select { padding: .4rem; font: inherit; }
  .hint { color: #595959; font-size: .9rem; margin: .25rem 0; }
  #content { background: #fff; border: 1px solid #ccc; padding: 1rem; border-radius: 6px; }
  #content img { max-width: 100%; height: auto; }

  details.item { border: 1px solid #ccc; border-radius: 6px; margin: 0 0 .5rem 0; background: #fff; }
  details.item > summary { cursor: pointer; padding: .65rem .9rem; font-weight: bold; list-style: none; display: flex; align-items: center; gap: .5rem; }
  details.item > summary::-webkit-details-marker { display: none; }
  details.item > summary::before { content: "\25B8"; }
  details.item[open] > summary::before { content: "\25BE"; }
  details.item > summary .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  details.item > .body { padding: .75rem 1rem 1rem; border-top: 1px solid #e5e5e5; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem 1rem; }
  .grid label { display: flex; flex-direction: column; font-size: .9rem; gap: 2px; }
  .grid input, .grid textarea { padding: .4rem; font: inherit; box-sizing: border-box; width: 100%; }
  .grid textarea { min-height: 4.5rem; resize: vertical; }
  .meta { display: flex; gap: 1rem; align-items: flex-end; margin-top: .75rem; }
  .meta label { display: flex; flex-direction: column; font-size: .9rem; gap: 2px; }
  .meta input { padding: .4rem; font: inherit; }
  .meta input.w { width: 80px; }
</style>
</head>
<body>

<div class="app">
<div class="editor-pane">
<h1>10-4 Studio</h1>
<div class="bar"><button id="sampleBtn" type="button">Load sample data (temp)</button></div>
<div class="bar">
  <label>Banner image: <input type="file" id="bannerFile" accept="image/png,image/jpeg,image/gif"></label>
  <label>Banner alt text: <input id="bannerAlt" size="40" placeholder="Describe the banner (leave empty if decorative)"></label>
  <button id="bannerRemove">Remove banner</button>
</div>
<p class="hint">Banner size: 1200 × 300 px, JPEG at 80% quality, 72 PPI.</p>
<p>Items are ordered by <b>weight</b> (higher = first), then by newest date. Each item has English and French text, with one shared date and weight.</p>

<div id="items"></div>
<div class="bar"><button id="addBtn">+ Add item</button></div>

<div class="bar">
  <button id="saveBtn">Save for Outlook (.eml → .oft)</button>
</div>
</div>

<div class="preview-pane">
<h2>Preview</h2>
<div id="content"></div>
</div>
</div>

<script>
const BANNER_W = 1200, BANNER_H = 300, BANNER_PPI = 72, BANNER_QUALITY = 0.8;
const KEY = "newsItemsV2";
const today = () => new Date().toISOString().slice(0,10);
const blank = () => ({ headlineEn: "", headlineFr: "", urlEn: "", urlFr: "",
  summaryEn: "", summaryFr: "", date: today(), weight: 1 });

let items = [];
try { items = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) {}
if (!items.length) {
  try {
    const old = JSON.parse(localStorage.getItem("newsItems") || "[]");
    items = old.map(o => Object.assign(blank(), {
      headlineEn: o.headline || "", urlEn: o.url || "", date: o.date || today(), weight: o.weight || 1 }));
  } catch (e) {}
}
if (!items.length) items = [Object.assign(blank(), {
  headlineEn: "Example headline", headlineFr: "Exemple de titre",
  urlEn: "https://example.com", urlFr: "https://example.com",
  summaryEn: "One or two sentences that summarize the story.",
  summaryFr: "Une ou deux phrases qui résument l’article.", weight: 5 })];

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : "https://" + u;

function persist() { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} }

function sorted(arr) {
  return [...arr].sort((a, b) =>
    (b.weight - a.weight) || String(b.date).localeCompare(String(a.date)));
}

const openItems = new Set();

const FIELD_DEFS = [
  ["headlineEn", "Headline (English)", "input"],
  ["headlineFr", "Titre (français)", "input"],
  ["urlEn", "URL (English)", "input"],
  ["urlFr", "URL (français)", "input"],
  ["summaryEn", "Summary (English)", "textarea"],
  ["summaryFr", "Résumé (français)", "textarea"]
];

function renderEditor() {
  const host = $("items");
  host.innerHTML = "";
  items.forEach((it, i) => {
    const d = document.createElement("details");
    d.className = "item";
    d.open = openItems.has(it);
    const fields = FIELD_DEFS.map(([f, label, tag]) =>
      tag === "textarea"
        ? `<label>${label}<textarea data-f="${f}">${esc(it[f])}</textarea></label>`
        : `<label>${label}<input data-f="${f}" value="${esc(it[f])}"></label>`).join("");
    d.innerHTML =
      `<summary><span class="title"></span></summary>
       <div class="body">
         <div class="grid">${fields}</div>
         <p class="hint">Summary allows: &lt;strong&gt;, &lt;em&gt;, &lt;ul&gt;, &lt;ol&gt;, &lt;li&gt; and &lt;a href="https://..."&gt;. Anything else is removed.</p>
         <div class="meta">
           <label>Date<input data-f="date" type="date" value="${esc(it.date)}"></label>
           <label>Weight<input data-f="weight" class="w" type="number" value="${esc(it.weight)}"></label>
           <button data-del type="button">Delete item</button>
         </div>
       </div>`;
    const title = d.querySelector(".title");
    const setTitle = () => { title.textContent = String(it.headlineEn).trim() || `Item ${i + 1}`; };
    setTitle();
    d.addEventListener("toggle", () => { d.open ? openItems.add(it) : openItems.delete(it); });
    d.querySelectorAll("[data-f]").forEach(el => {
      el.addEventListener("input", () => {
        const f = el.dataset.f;
        it[f] = f === "weight" ? Number(el.value) || 0 : el.value;
        if (f === "headlineEn") setTitle();
        persist(); renderPreview();
      });
      if (el.dataset.f === "weight" || el.dataset.f === "date")
        el.addEventListener("change", () => {
          items = sorted(items); persist(); renderEditor(); renderPreview();
        });
    });
    d.querySelector("[data-del]").addEventListener("click", () => {
      items.splice(items.indexOf(it), 1); openItems.delete(it);
      persist(); renderEditor(); renderPreview();
    });
    host.appendChild(d);
  });
}

let banner = null;
try { banner = JSON.parse(localStorage.getItem("newsBanner") || "null"); } catch (e) {}

function fmtDate(d, locale) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || "");
  if (!m) return esc(d || "");
  const fr = /^fr/i.test(locale || "");
  const [y, mo, day] = [+m[1], +m[2], +m[3]];
  const month = new Date(y, mo - 1, day).toLocaleDateString(fr ? "fr-CA" : "en-CA", { month: "long" });
  const NB = "\u00A0";
  if (fr) return (day === 1 ? "1<sup>er</sup>" : String(day)) + NB + month + NB + y;
  return month.charAt(0).toUpperCase() + month.slice(1) + NB + day + ", " + y;
}

const FONT = "font-family:Calibri,Arial,sans-serif;";

function frTypo(t) {
  const NB = "\u00A0";
  return t
    .replace(/\s+([?!;])/g, "$1")
    .replace(/\s+:/g, NB + ":")
    .replace(/«\s*/g, "«" + NB)
    .replace(/\s*»/g, NB + "»")
    .replace(/(\d)\s+([%$])/g, "$1" + NB + "$2");
}

function cleanHeadline(text, fr) {
  const t = String(text).trim().replace(/[\s.!;,:…]+$/, "");
  return fr ? frTypo(t) : t;
}

const LIST_STYLE = () => `margin:8px 0 0 0;padding-left:22px;${FONT}font-size:15px;line-height:1.5;color:#1a1a1a;`;
const ITEM_STYLE = () => `margin:0 0 4px 0;${FONT}font-size:15px;line-height:1.5;color:#1a1a1a;`;
const DROP_TAGS = new Set(["script", "style", "iframe", "object", "embed", "template", "noscript"]);

function sanitizeSummary(input, fr) {
  const doc = new DOMParser().parseFromString("<body>" + input, "text/html");
  const walk = (node, parentTag) => {
    let out = "";
    node.childNodes.forEach(child => {
      if (child.nodeType === 3) {
        const t = child.textContent;
        if ((parentTag === "ul" || parentTag === "ol") && !t.trim()) return;
        out += esc(fr ? frTypo(t) : t).replace(/\r?\n/g, "<br>");
        return;
      }
      if (child.nodeType !== 1) return;
      const tag = child.tagName.toLowerCase();
      if (DROP_TAGS.has(tag)) return;
      const inner = walk(child, tag);
      if (tag === "strong" || tag === "em") out += `<${tag}>${inner}</${tag}>`;
      else if (tag === "ul" || tag === "ol") out += `<${tag} style="${LIST_STYLE()}">${inner}</${tag}>`;
      else if (tag === "li" && (parentTag === "ul" || parentTag === "ol")) out += `<li style="${ITEM_STYLE()}">${inner}</li>`;
      else if (tag === "a") {
        const href = (child.getAttribute("href") || "").trim();
        out += /^(https:\/\/|mailto:)/i.test(href)
          ? `<a href="${esc(href)}" style="color:#0b4fb3;text-decoration:underline;">${inner}</a>`
          : inner;
      } else out += inner;
    });
    return out;
  };
  return walk(doc.body, "body").trim();
}

const SUBJECT = "10-4 Newsletter";
const LANG_EN = "en-CA";
const LANG_FR = "fr-CA";
const ITEM_DIVIDER = "border-bottom:2px dotted #8c8c8c;";
const SECTION_DIVIDER = "border-top:3px solid #1a1a1a;";

function fileBaseName(now) {
  const t = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const week = Math.ceil(((t - yearStart) / 86400000 + 1) / 7);
  return "10-4-" + String(week).padStart(2, "0") + "-" + t.getUTCFullYear();
}

function rowsHtml(lang, locale, emptyText) {
  const list = sorted(items).filter(it => String(it["headline" + lang]).trim());
  return list.map((it, idx) => {
    const first = idx === 0, last = idx === list.length - 1;
    const fr = lang === "Fr";
    const headline = cleanHeadline(it["headline" + lang], fr);
    const url = (it["url" + lang] || it.urlEn || it.urlFr || "").trim();
    const summary = String(it["summary" + lang] || "").trim();
    const h = url
      ? `<a href="${esc(safeUrl(url))}" style="color:#0b4fb3;text-decoration:underline;">${esc(headline)}</a>`
      : esc(headline);
    const cleaned = summary ? sanitizeSummary(summary, fr) : "";
    const sum = cleaned
      ? `<div style="margin:8px 0 0 0;${FONT}font-size:15px;line-height:1.5;color:#1a1a1a;">${cleaned}</div>`
      : "";
    const pad = `padding:${first ? 0 : 20}px 0 20px 0;`;
    return `<tr><td${fr ? ` lang="${LANG_FR}"` : ""} style="${pad}${last ? "" : ITEM_DIVIDER}">` +
      `<h2 style="margin:0 0 4px 0;${FONT}font-size:18px;line-height:1.4;color:#1a1a1a;">${h}</h2>` +
      `<p style="margin:0;${FONT}font-size:14px;line-height:1.5;color:#595959;">${fmtDate(it.date, locale)}</p>` +
      sum + `</td></tr>`;
  }).join("") || `<tr><td style="${FONT}font-size:16px;color:#1a1a1a;">${emptyText}</td></tr>`;
}

function contentHtml(forExport) {
  const alt = $("bannerAlt").value.trim();
  const jump = `<tr><td style="padding:0 0 12px 0;"><p lang="${LANG_FR}" style="margin:0;${FONT}font-size:14px;line-height:1.5;"><a href="#french" style="color:#0b4fb3;text-decoration:underline;">Le fran\u00e7ais suit</a></p></td></tr>`;
  const img = banner
    ? `<tr><td style="padding:0 0 16px 0;"><img src="${forExport ? "cid:banner" : banner.dataUrl}" alt="${esc(alt)}" width="600" height="150" style="display:block;width:100%;max-width:600px;height:auto;border:0;-ms-interpolation-mode:bicubic;"></td></tr>`
    : "";
  const title = `<tr><td style="padding:0 0 16px 0;"><h1 style="margin:0;${FONT}font-size:24px;line-height:1.3;color:#1a1a1a;">${esc(SUBJECT)}</h1></td></tr>`;
  const frTitle = `<tr><td style="padding:16px 0 16px 0;${SECTION_DIVIDER}"><h1 lang="${LANG_FR}" style="margin:0;${FONT}font-size:24px;line-height:1.3;color:#1a1a1a;"><a name="french" id="french"></a>Bulletin 10-4</h1></td></tr>`;
  return `<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;">` +
    jump + img + title +
    rowsHtml("En", LANG_EN, "No items.") +
    frTitle +
    rowsHtml("Fr", LANG_FR, "Aucun \u00e9l\u00e9ment.") +
    `</table>`;
}

function renderPreview() { $("content").innerHTML = contentHtml(false); }

$("addBtn").addEventListener("click", () => {
  const item = blank();
  items.push(item); openItems.add(item);
  persist(); renderEditor(); renderPreview();
  $("items").lastElementChild.scrollIntoView({ block: "nearest" });
});

function toBase64Utf8(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/.{1,76}/g, "$&\r\n");
}

function buildEml(subject, html, img) {
  const encSubject = "=?UTF-8?B?" + btoa(
    String.fromCharCode(...new TextEncoder().encode(subject))) + "?=";
  const head = ["X-Unsent: 1", "Subject: " + encSubject, "MIME-Version: 1.0"];
  const m = img && /^data:([^;]+);base64,(.*)$/.exec(img.dataUrl);
  if (!m) return head.concat(["Content-Type: text/html; charset=utf-8",
    "Content-Transfer-Encoding: base64", "", toBase64Utf8(html)]).join("\r\n");
  const b = "----=_Part_" + Date.now();
  return head.concat([
    'Content-Type: multipart/related; boundary="' + b + '"; type="text/html"', "",
    "--" + b,
    "Content-Type: text/html; charset=utf-8",
    "Content-Transfer-Encoding: base64", "", toBase64Utf8(html),
    "--" + b,
    "Content-Type: " + m[1],
    "Content-Transfer-Encoding: base64",
    "Content-ID: <banner>",
    'Content-Disposition: inline; filename="banner.jpg"', "",
    m[2].replace(/.{1,76}/g, "$&\r\n"),
    "--" + b + "--", ""
  ]).join("\r\n");
}

$("saveBtn").addEventListener("click", () => {
  const subject = SUBJECT;
  const lang = LANG_EN;
  const html = `<!DOCTYPE html><html lang="${lang}" xml:lang="${lang}"><head><meta charset="utf-8"><title>${esc(subject)}</title></head><body>` +
               contentHtml(true) + "</body></html>";
  const blob = new Blob([buildEml(subject, html, banner)], { type: "message/rfc822" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fileBaseName(new Date()) + ".eml";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
});

function setJpegPpi(dataUrl, ppi) {
  const bin = atob(dataUrl.split(",")[1]);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const isJfif = bytes[0] === 0xFF && bytes[1] === 0xD8 && bytes[2] === 0xFF && bytes[3] === 0xE0 &&
                 bytes[6] === 0x4A && bytes[7] === 0x46 && bytes[8] === 0x49 && bytes[9] === 0x46;
  if (isJfif) {
    bytes[13] = 1;
    bytes[14] = ppi >> 8; bytes[15] = ppi & 255;
    bytes[16] = ppi >> 8; bytes[17] = ppi & 255;
  }
  let out = "";
  for (let i = 0; i < bytes.length; i += 0x8000)
    out += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return "data:image/jpeg;base64," + btoa(out);
}

function processBanner(srcUrl) {
  return new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement("canvas");
      c.width = BANNER_W; c.height = BANNER_H;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, BANNER_W, BANNER_H);
      ctx.imageSmoothingQuality = "high";
      const scale = Math.max(BANNER_W / im.width, BANNER_H / im.height);
      const w = im.width * scale, h = im.height * scale;
      ctx.drawImage(im, (BANNER_W - w) / 2, (BANNER_H - h) / 2, w, h);
      resolve(setJpegPpi(c.toDataURL("image/jpeg", BANNER_QUALITY), BANNER_PPI));
    };
    im.onerror = reject;
    im.src = srcUrl;
  });
}

$("bannerFile").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      banner = { dataUrl: await processBanner(r.result) };
    } catch (err) {
      alert("Could not read that image.");
      return;
    }
    try { localStorage.setItem("newsBanner", JSON.stringify(banner)); } catch (err) {}
    renderPreview();
  };
  r.readAsDataURL(f);
});
$("bannerRemove").addEventListener("click", () => {
  banner = null;
  try { localStorage.removeItem("newsBanner"); } catch (err) {}
  $("bannerFile").value = "";
  renderPreview();
});

["bannerAlt"].forEach(id => $(id).addEventListener("input", renderPreview));

const SAMPLE_ITEMS = [
  { headlineEn: "Autobot convoy reaches the Iacon outpost",
    headlineFr: "Le convoi autobot atteint l’avant-poste d’Iacon",
    urlEn: "https://example.com/en/convoy-iacon", urlFr: "https://example.com/fr/convoi-iacon",
    summaryEn: "The <strong>Autobot convoy</strong> arrived after a three-day run across the Cybertron plains. Crews report <em>no delays</em> and full energon reserves.",
    summaryFr: "Le <strong>convoi autobot</strong> est arrivé après trois jours de route dans les plaines de Cybertron. Les équipes ne signalent <em>aucun retard</em> et des réserves d’énergon pleines.",
    date: "2026-11-24", weight: 5 },
  { headlineEn: "Decepticon raid on energon depot foiled",
    headlineFr: "Un raid décepticon sur un dépôt d’énergon est déjoué",
    urlEn: "https://example.com/en/depot-raid", urlFr: "https://example.com/fr/raid-depot",
    summaryEn: "Autobot patrols stopped the raid before any cargo was lost. What happens next:<ul><li>Two depots are now secured</li><li>Patrols are <strong>doubled</strong> this week</li><li>Repairs finish by December 1</li></ul>",
    summaryFr: "Les patrouilles autobots ont arrêté le raid avant toute perte de cargaison. La suite :<ul><li>deux dépôts sont maintenant sécurisés;</li><li>les patrouilles sont <strong>doublées</strong> cette semaine;</li><li>les réparations se terminent d’ici le 1er décembre.</li></ul>",
    date: "2026-11-20", weight: 5 },
  { headlineEn: "New energon cube standards take effect",
    headlineFr: "De nouvelles normes pour les cubes d’énergon entrent en vigueur",
    urlEn: "https://example.com/en/energon-standards", urlFr: "https://example.com/fr/normes-energon",
    summaryEn: "Every cube must now carry a <em>stability label</em>. Read the <a href=\"https://example.com/en/energon-guide\">full guide for handlers</a> before your next shift.",
    summaryFr: "Chaque cube doit maintenant porter une <em>étiquette de stabilité</em>. Lisez le <a href=\"https://example.com/fr/guide-energon\">guide complet pour les manutentionnaires</a> avant votre prochain quart.",
    date: "2026-11-01", weight: 3 },
  { headlineEn: "Training day: transformation drills for new recruits",
    headlineFr: "Journée d’entraînement : exercices de transformation pour les nouvelles recrues",
    urlEn: "https://example.com/en/training-day", urlFr: "https://example.com/fr/journee-entrainement",
    summaryEn: "New recruits practise safe transformation in three steps:<ol><li>Check your joints and armour</li><li>Transform at half speed</li><li>Report any stiffness to the medic</li></ol>Questions? Write to <a href=\"mailto:training@example.com\">training@example.com</a>.",
    summaryFr: "Les nouvelles recrues pratiquent la transformation sécuritaire en trois étapes :<ol><li>vérifiez vos articulations et votre blindage;</li><li>transformez-vous à demi-vitesse;</li><li>signalez toute raideur au médecin.</li></ol>Des questions? Écrivez à <a href=\"mailto:training@example.com\">training@example.com</a>.",
    date: "2026-10-28", weight: 2 },
  { headlineEn: "Reminder: sign up for maintenance week",
    headlineFr: "Rappel : inscrivez-vous à la semaine d’entretien",
    urlEn: "https://example.com/en/maintenance-week", urlFr: "https://example.com/fr/semaine-entretien",
    summaryEn: "Spots fill fast. <strong>Sign up by December 5</strong> to book your time slot.",
    summaryFr: "Les places partent vite. <strong>Inscrivez-vous avant le 5 décembre</strong> pour réserver votre plage horaire.",
    date: "2026-10-15", weight: 1 }
];

$("sampleBtn").addEventListener("click", () => {
  items = sorted(SAMPLE_ITEMS.map(o => Object.assign({}, o)));
  $("bannerAlt").value = "10-4 Studio sample banner";
  openItems.clear(); openItems.add(items[0]);
  persist(); renderEditor(); renderPreview();
});

items = sorted(items);
if (items.length) openItems.add(items[0]);
renderEditor(); renderPreview();
</script>
</body>
</html>
