<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Feud · Querelle de famille</title>
<style>
:root{--bg:#050d3d;--fg:#fff;--card:#10278f;--line:#5a82ff;--accent:#ffc928;--accent-fg:#1a1200;--board:#0a1f9e;--tile:#1c46c9;--gold:#ffd23f;--red:#c81e1e;--muted:#b8c8ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:14px}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:1.4rem;margin:0;color:var(--gold);font-weight:900;letter-spacing:.04em;text-transform:uppercase}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 12px;border-radius:8px}
button.p{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.d{background:var(--red);color:#fff;border-color:var(--red)}
button.on{outline:2px solid var(--accent)}
button:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,textarea{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}
.muted{color:var(--muted);font-size:.9rem}
.home{text-align:center;padding:40px 10px}.home .row{justify-content:center;margin-top:18px}
.board{background:var(--board);border:4px solid var(--gold);border-radius:16px;padding:14px;color:#fff}
.q{font-size:clamp(1.2rem,4vw,2rem);font-weight:800;text-align:center;margin:6px 0 14px;color:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.tile{display:flex;align-items:stretch;min-height:56px;background:var(--tile);border:2px solid #fff;border-radius:10px;overflow:hidden;font-weight:800;font-size:clamp(1rem,3vw,1.4rem)}
.tile .n{flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:4px 12px}
.tile .pt{width:64px;display:flex;align-items:center;justify-content:center;background:var(--gold);color:#222}
.tile.hid .n{align-items:center;justify-content:center;font-size:1.6rem;color:#cfe0ff}.tile.hid .pt{display:none}
.scores{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-top:14px;align-items:stretch}
.team{background:#071452;border-radius:12px;padding:10px;text-align:center;border:2px solid transparent}
.team.ctl{border-color:var(--gold)}.team b{display:block;font-size:2rem;color:var(--gold)}
.bank{text-align:center;padding:10px;background:#071452;border-radius:12px}.bank b{display:block;font-size:1.6rem}
.strikes{text-align:center;font-size:2rem;color:#ff8a8a;min-height:2.4rem;margin-top:8px;letter-spacing:6px;font-weight:900}
#xo{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:9;color:#ff8a8a;font-weight:900;font-size:min(50vw,60vh);pointer-events:none}
.tiny{font-size:.8rem}
::placeholder{color:var(--muted)}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ans{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="xo">✖</div>
<div class="wrap">
  <div class="top">
    <h1 id="title"></h1>
    <div class="row">
      
      
    </div>
  </div>
  <div id="home" class="home card"></div>
  <div id="player" hidden></div>
  <div id="admin" hidden>
    <div id="login" class="card" hidden style="display:grid;gap:8px;max-width:420px">
      <b id="loginT">Host sign-in / Connexion de l’animateur</b>
      <input id="lemail" type="email" autocomplete="username" placeholder="Email / Courriel" aria-label="Email">
      <input id="lpass" type="password" autocomplete="current-password" placeholder="Password / Mot de passe" aria-label="Password">
      <div class="row"><button class="p" id="loginBtn">Sign in / Connexion</button><span id="loginErr" style="color:#ff8a8a"></span></div>
    </div>
    <div class="row" style="margin-bottom:12px"><button id="logout" hidden>Sign out / Déconnexion</button></div>
    <div id="adminDyn"></div>
    <details class="card" id="addForm">
      <summary id="addSum"></summary>
      <div id="editor" style="margin-top:10px"></div>
    </details>
  </div>
</div>
<script>
const T={
en:{title:"Family Feud",home:"Home",hello:"Choose your screen",adminBtn:"Host (admin)",playerBtn:"Players screen",
wait:"Waiting for the host to start the game…",noacc:"Host sign-in required to use the admin screen.",
start:"Create the game",round:"Round",of:"of",team:"Team",bank:"Bank",mult:"Multiplier",strike:"Strike ✖",reveal:"Reveal",hide:"Hide",
award:"Give bank to",next:"Next question",prev:"Previous",resetScores:"Reset scores",resetRound:"Reset round",control:"In control",
showQ:"Show question",hideQ:"Hide question",add:"Edit questions and answers",addQ:"Add a question",addAns:"Add an answer",del:"Delete",sure:"Sure? Click again",
conn:"Connecting…",nodb:"Live sync is unavailable. Check the Firebase settings at the top of the script.",
hint:"Share this page's link with players: they just open “Players screen”.",wins:"Final scores"},
fr:{title:"Querelle de famille",home:"Accueil",hello:"Choisissez votre écran",adminBtn:"Animateur (admin)",playerBtn:"Écran des joueurs",
wait:"En attente de l’animateur…",noacc:"Connexion de l’animateur requise pour l’écran admin.",
start:"Créer la partie",round:"Manche",of:"sur",team:"Équipe",bank:"Cagnotte",mult:"Multiplicateur",strike:"Erreur ✖",reveal:"Révéler",hide:"Cacher",
award:"Donner la cagnotte à",next:"Question suivante",prev:"Précédente",resetScores:"Remettre les scores à zéro",resetRound:"Réinitialiser la manche",control:"Contrôle",
showQ:"Afficher la question",hideQ:"Cacher la question",add:"Modifier les questions et réponses",addQ:"Ajouter une question",addAns:"Ajouter une réponse",del:"Supprimer",sure:"Sûr ? Cliquez encore",
conn:"Connexion…",nodb:"La synchronisation en direct n’est pas disponible. Vérifiez les paramètres Firebase au début du script.",
hint:"Partagez le lien de cette page : les joueurs ouvrent « Écran des joueurs ».",wins:"Scores"}};
const DEF=[
{q:{en:"Name something you find in a kitchen",fr:"Nommez quelque chose qu’on trouve dans une cuisine"},a:[["Fridge","Réfrigérateur",35],["Stove","Cuisinière",25],["Sink","Évier",20],["Table","Table",12],["Microwave","Micro-ondes",8]]},
{q:{en:"Name a popular pet",fr:"Nommez un animal de compagnie populaire"},a:[["Dog","Chien",40],["Cat","Chat",33],["Fish","Poisson",12],["Bird","Oiseau",8],["Rabbit","Lapin",7]]},
{q:{en:"Something you bring on vacation",fr:"Quelque chose qu’on apporte en vacances"},a:[["Sunscreen","Crème solaire",30],["Swimsuit","Maillot de bain",25],["Camera","Appareil photo",18],["Sunglasses","Lunettes de soleil",15],["Book","Livre",12]]},
{q:{en:"Name a winter activity",fr:"Nommez une activité d’hiver"},a:[["Skiing","Ski",34],["Skating","Patinage",28],["Snowman","Bonhomme de neige",18],["Sledding","Glissade",12],["Hockey","Hockey",8]]}];
const newState=()=>({qs:DEF.map(d=>({q:d.q,a:d.a.map(x=>({en:x[0],fr:x[1],pts:x[2]}))})),qi:0,rev:[],strikes:0,sk:0,bank:0,mult:1,ctl:"",A:{n:"",s:0},B:{n:"",s:0}});
let lang=(navigator.language||"en").toLowerCase().startsWith("fr")?"fr":"en";
let S=null,ref=null,canEdit=false,status="conn",lastSk=0;
const $=id=>document.getElementById(id);
const t=k=>T.en[k]+" / "+T.fr[k];
const bi=(en,fr)=>en===fr?`<span>${esc(en)}</span>`:`<span>${esc(en)}</span><span>${esc(fr)}</span>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tn=k=>{const i=k==="A"?"1":"2";return S[k].n||(T.en.team+" "+i+" / "+T.fr.team+" "+i)};
const view=()=>location.hash==="#admin"?"admin":location.hash==="#player"?"player":"home";

function save(next){S=next;render();if(ref)ref.set({s:JSON.stringify(S)}).catch(e=>console.error(e));}
const clone=()=>JSON.parse(JSON.stringify(S));
const cur=()=>S.qs[S.qi];

function shell(){
  document.documentElement.lang=lang;
  $("title").textContent=t("title");
  $("addSum").textContent=t("add");
  const v=view();
  $("home").hidden=v!=="home";$("player").hidden=v!=="player";$("admin").hidden=v!=="admin";
}
function msg(k){return `<div class="card muted">${t(k)}</div>`;}

function boardHTML(){
  const c=cur();
  const tiles=c.a.map((a,i)=>{const r=S.rev[i];
    return `<div class="tile ${r?"":"hid"}"><div class="n">${r?bi(a.en,a.fr):(i+1)}</div><div class="pt">${r?a.pts*1:""}</div></div>`}).join("");
  const sk="✖ ".repeat(S.strikes).trim();
  return `<div class="board"><div class="muted" style="color:#9fb4ff;text-align:center">${T.en.round} ${S.qi+1} · ${T.fr.round} ${S.qi+1}${S.mult>1?" · ×"+S.mult:""}</div>
  <div class="q">${S.showQ?`${esc(c.q.en)}<div style="margin-top:4px">${esc(c.q.fr)}</div>`:"?"}</div><div class="tiles">${tiles}</div><div class="strikes">${sk}</div>
  <div class="scores"><div class="team ${S.ctl==="A"?"ctl":""}">${esc(tn("A"))}<b>${S.A.s}</b></div>
  <div class="bank">${t("bank")}<b>${S.bank}</b></div>
  <div class="team ${S.ctl==="B"?"ctl":""}">${esc(tn("B"))}<b>${S.B.s}</b></div></div></div>`;
}

function renderPlayer(){
  if(!S){$("player").innerHTML=msg(status==="nodb"?"nodb":status==="wait"?"wait":"conn");return;}
  $("player").innerHTML=boardHTML();
}

function renderAdmin(){
  const el=$("adminDyn");$("login").hidden=canEdit||status==="nodb";$("logout").hidden=!canEdit;$("addForm").hidden=!(canEdit&&S&&status!=="nodb");
  if(status==="nodb"){el.innerHTML=msg("nodb");return;}
  if(!canEdit){el.innerHTML=msg("noacc");return;}
  if(!S){el.innerHTML=msg("conn");return;}
  const c=cur();
  const ans=c.a.map((a,i)=>`<div class="ans"><div><b>${i+1}.</b> ${esc(a.en)} <span class="muted">/ ${esc(a.fr)}</span> · <b>${a.pts}</b></div>
   <button data-rv="${i}" class="${S.rev[i]?"on":"p"}">${S.rev[i]?t("hide"):t("reveal")}</button></div>`).join("");
  el.innerHTML=`<div class="card muted tiny">${t("hint")}</div>${boardHTML()}
  <div class="card"><b>${esc(c.q.en)}</b><br><span class="muted">${esc(c.q.fr)}</span>${ans}</div>
  <div class="card row"><button data-act="showq" class="${S.showQ?"on":"p"}">${S.showQ?t("hideQ"):t("showQ")}</button></div>
  <div class="card row">
    <button class="d" data-act="strike">${t("strike")}</button>
    <span>${t("mult")}:</span>${[1,2,3].map(m=>`<button data-mult="${m}" class="${S.mult===m?"on":""}">×${m}</button>`).join("")}
    <span>${t("control")}:</span><button data-ctl="A" class="${S.ctl==="A"?"on":""}">${esc(tn("A"))}</button><button data-ctl="B" class="${S.ctl==="B"?"on":""}">${esc(tn("B"))}</button>
  </div>
  <div class="card row"><span>${t("award")}:</span>
    <button class="p" data-aw="A">${esc(tn("A"))}</button><button class="p" data-aw="B">${esc(tn("B"))}</button></div>
  <div class="card row"><button data-act="prev" ${S.qi===0?"disabled":""}>◀ ${t("prev")}</button>
    <button class="p" data-act="next" ${S.qi>=S.qs.length-1?"disabled":""}>${t("next")} ▶</button>
    <button data-act="rr">${t("resetRound")}</button><button class="d" data-act="rs">${t("resetScores")}</button></div>
  <div class="card row"><input id="tnA" value="${esc(S.A.n)}" placeholder="${t("team")} 1" style="flex:1;min-width:140px">
    <input id="tnB" value="${esc(S.B.n)}" placeholder="${t("team")} 2" style="flex:1;min-width:140px"></div>`;
  $("tnA").onchange=e=>{const n=clone();n.A.n=e.target.value;save(n)};
  $("tnB").onchange=e=>{const n=clone();n.B.n=e.target.value;save(n)};
}

function render(){
  shell();const v=view();
  if(v==="home"){$("home").innerHTML=`<h2>${t("hello")}</h2><div class="row"><button class="p" id="goA">${t("adminBtn")}</button><button id="goP">${t("playerBtn")}</button></div>`;
    if($("goA"))$("goA").onclick=()=>location.hash="admin";$("goP").onclick=()=>location.hash="player";}
  if(v==="player")renderPlayer();
  if(v==="admin")renderAdmin();
  if(S&&S.sk!==lastSk){if(lastSk!==null&&S.sk>lastSk&&v==="player"){const x=$("xo");x.style.display="flex";setTimeout(()=>x.style.display="none",1400);}lastSk=S.sk;}
}

function newRound(n,qi){n.qi=qi;n.rev=[];n.strikes=0;n.bank=0;n.ctl="";n.mult=1;n.showQ=false;}
$("adminDyn").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||!S||!canEdit)return;const n=clone(),d=b.dataset,c=n.qs[n.qi];
  if(d.rv!==undefined){const i=+d.rv;if(n.rev[i]){n.rev[i]=false;n.bank-=c.a[i].pts*n.mult;}else{n.rev[i]=true;n.bank+=c.a[i].pts*n.mult;}}
  else if(d.mult)n.mult=+d.mult;
  else if(d.ctl)n.ctl=d.ctl;
  else if(d.aw){n[d.aw].s+=n.bank;n.bank=0;}
  else if(d.act==="strike"){n.strikes=Math.min(3,n.strikes+1);n.sk=(n.sk||0)+1;}
  else if(d.act==="showq")n.showQ=!n.showQ;
  else if(d.act==="next")newRound(n,n.qi+1);
  else if(d.act==="prev")newRound(n,n.qi-1);
  else if(d.act==="rr")newRound(n,n.qi);
  else if(d.act==="rs"){n.A.s=0;n.B.s=0;}
  else return;
  save(n);
});
let armed=-1;
function renderEditor(){
  const el=$("editor");if(!S){el.innerHTML="";return;}
  el.innerHTML=S.qs.map((q,qi)=>`<div class="card" data-q="${qi}">
   <div class="row"><b>#${qi+1}</b>
    <button data-e="up" aria-label="Up" ${qi===0?"disabled":""}>▲</button><button data-e="dn" aria-label="Down" ${qi===S.qs.length-1?"disabled":""}>▼</button>
    <button class="d" data-e="delq" ${S.qs.length<=1?"disabled":""}>${armed===qi?t("sure"):t("del")}</button></div>
   <input data-f="qen" value="${esc(q.q.en)}" placeholder="Question (EN)" aria-label="Question (EN)" style="margin-top:8px">
   <input data-f="qfr" value="${esc(q.q.fr)}" placeholder="Question (FR)" aria-label="Question (FR)" style="margin-top:6px">
   ${q.a.map((a,ai)=>`<div class="row" data-a="${ai}" style="margin-top:6px">
     <input data-f="en" value="${esc(a.en)}" placeholder="EN" aria-label="Answer ${ai+1} (EN)" style="flex:2;min-width:110px;width:auto">
     <input data-f="fr" value="${esc(a.fr)}" placeholder="FR" aria-label="Answer ${ai+1} (FR)" style="flex:2;min-width:110px;width:auto">
     <input data-f="pts" type="number" min="0" value="${a.pts}" aria-label="Points ${ai+1}" style="width:80px">
     <button class="d" data-e="dela" aria-label="${t("del")}" ${q.a.length<=1?"disabled":""}>✖</button></div>`).join("")}
   <button data-e="adda" style="margin-top:8px" ${q.a.length>=8?"disabled":""}>+ ${t("addAns")}</button></div>`).join("")
   +`<button class="p" data-e="addq">+ ${t("addQ")}</button>`;
}
$("addForm").addEventListener("toggle",()=>{if($("addForm").open){armed=-1;renderEditor();}});
$("editor").addEventListener("change",e=>{
  const f=e.target.dataset.f;if(!f||!S||!canEdit)return;
  const n=clone(),q=n.qs[+e.target.closest("[data-q]").dataset.q];
  if(f==="qen")q.q.en=e.target.value.trim();
  else if(f==="qfr")q.q.fr=e.target.value.trim();
  else{const a=q.a[+e.target.closest("[data-a]").dataset.a];
    if(f==="pts"){const v=Math.max(0,Math.round(+e.target.value||0));a.pts=v;e.target.value=v;}else a[f]=e.target.value.trim();}
  save(n);
});
$("editor").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||!S||!canEdit)return;
  const act=b.dataset.e,qel=b.closest("[data-q]"),qi=qel?+qel.dataset.q:-1,n=clone(),was=n.qi,curQ=n.qs[n.qi];
  if(act==="delq"&&armed!==qi){armed=qi;renderEditor();return;}
  armed=-1;
  if(act==="addq")n.qs.push({q:{en:"",fr:""},a:[{en:"",fr:"",pts:10}]});
  else if(act==="adda"){if(n.qs[qi].a.length>=8)return;n.qs[qi].a.push({en:"",fr:"",pts:5});}
  else if(act==="dela"){const q=n.qs[qi];if(q.a.length<=1)return;const ai=+b.closest("[data-a]").dataset.a;q.a.splice(ai,1);if(q===curQ)n.rev.splice(ai,1);}
  else if(act==="up"&&qi>0){const x=n.qs.splice(qi,1)[0];n.qs.splice(qi-1,0,x);}
  else if(act==="dn"&&qi<n.qs.length-1){const x=n.qs.splice(qi,1)[0];n.qs.splice(qi+1,0,x);}
  else if(act==="delq"){if(n.qs.length<=1)return;n.qs.splice(qi,1);}
  else return;
  const ni=n.qs.indexOf(curQ);
  if(ni>=0)n.qi=ni;else newRound(n,Math.min(was,n.qs.length-1));
  save(n);renderEditor();
});
addEventListener("hashchange",render);

function applySnap(snap){
  if(snap.exists){try{const s=JSON.parse(snap.data().s);if(s&&s.qs){S=s;if(lastSk===0&&!S.sk)lastSk=0;}}catch(e){}}
  else if(canEdit){S=newState();ref.set({s:JSON.stringify(S)}).catch(()=>{});}
  else status="wait";
  render();
}
/* ===== FIREBASE SETTINGS: paste yours here (see setup steps) ===== */
const FIREBASE_CONFIG={apiKey:"AIzaSyDGh7Z3lqqABQdsRZZtNPByZVxooKMs8_Q",authDomain:"family-feud-d21be.firebaseapp.com",projectId:"family-feud-d21be",storageBucket:"family-feud-d21be.firebasestorage.app",messagingSenderId:"506950216904",appId:"1:506950216904:web:c9f34880f72a9dd1d749fd"};
(async()=>{
  render();
  if(typeof firebase==="undefined"||FIREBASE_CONFIG.apiKey.startsWith("YOUR_")){status="nodb";render();return;}
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth=firebase.auth();
  ref=firebase.firestore().collection("game").doc("state");
  auth.onAuthStateChanged(u=>{canEdit=!!u;if(canEdit&&!S&&status==="wait"){S=newState();ref.set({s:JSON.stringify(S)}).catch(()=>{});}render();});
  $("loginBtn").onclick=()=>{$("loginErr").textContent="";auth.signInWithEmailAndPassword($("lemail").value.trim(),$("lpass").value).catch(()=>{$("loginErr").textContent="Sign-in failed / Échec de connexion";});};
  $("logout").onclick=()=>auth.signOut();
  const timer=setTimeout(()=>{if(!S){status="nodb";render();}},10000);
  ref.onSnapshot(s=>{clearTimeout(timer);if(lastSk===0&&s.exists){try{lastSk=JSON.parse(s.data().s).sk||0}catch(e){}}applySnap(s);},e=>{clearTimeout(timer);status="nodb";render();});
})();
</script>
</body>
</html>
